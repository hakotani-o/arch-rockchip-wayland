# This is a basic workflow to help you get started with Actions

name: main
on: workflow_dispatch
#workflow_dispatch
#[push]
jobs:
  command:
    name: Use Linux commands
    runs-on: ubuntu-24.04-arm
    env:
     FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  
    permissions:
      contents: write  # これがリリース作成に必要

    steps:
    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout
        uses: actions/checkout@v4

      - name: all
        run: |
          chmod +x *.sh
          ./control-main.sh
            echo "============================"
            ls -l
            echo "============================="
 
#      - name: Upload a diisk image
#        uses: actions/upload-artifact@v4.5.0
#        with:
#         name: ubuntu-image-orangepi-5
#         path: ./Ubuntu-*img.xz
#         compression-level: 0
#          # The desired behavior if no files are found using the provided path.
#         if-no-files-found: error

      - name: Get current date
        id: date
        run: echo "now=$(date +'%Y-%m-%d %H:%M')" >> $GITHUB_OUTPUT

      - name: Get kernel version
        id: kernel
        run: cat kernel_version >> $GITHUB_OUTPUT
        
# 旧: upload-artifact のステップをコメントアウトまたは削除し、以下を追加
      - name: Create Release and Upload
        uses: softprops/action-gh-release@v2
        with:
          # 実行するたびにユニークなタグ名（例: build-1, build-2...）を付けます
          tag_name: build-${{ github.run_number }}
          name: "Orange Pi 5 / 5-PLUS Disk Image Build ${{ github.run_number }}"
          body: |
            Arch linux Rockchip Wayland ディスクイメージ Orange Pi 5 / 5-PLUS 
            ビルド日時: ${{ steps.date.outputs.now }}
            カーネル : ${{ steps.kernel.outputs.kernel_version }}
            
            ### VP9 Hardware Decoding Support
            We have successfully enabled VP9 hardware decoding by applying the following rkvdec kernel patches from the [warpme/minimyth2](https://github.com/warpme/minimyth2) project:

            - 3559-media-rkvdec-fix-PM-runtime-teardown-ordering-in-remove.patch
            - 3569-media-rkvdec-prime-VDPU383-deblock-warmup-rk3576.patch
            - 3570-media-rkvdec-add-VP9-VDPU381-decoder-support.patch
            - 3571-media-rkvdec-vp9-fix-altref-vscale-and-segmap-size-for-2K-decode.patch
            - 3572-media-rkvdec-vdpu381-add-VP9-profile-2-10bit-support.patch
            - 3573-media-rkvdec-vdpu381-vp9-use-the-real-buffer-stride.patch
            - 3574-media-rkvdec-Add-support-for-the-VDPU346-variant.patch

            Special thanks to the original authors and the minimyth2 project for creating and publishing these essential patches!

          draft: false
          prerelease: false
          # ここに圧縮済みファイルのパスを指定します
          files: |
            ./Arch-linux-*img.xz
            ./linux-aarch64-rockchip-7*
            ./linux-aarch64-rockchip-headers-7*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
